<!doctype html>
<html lang="en" data-fd-surface="app">

    <meta charset="utf-8" />

    <!-- csp -->

    <link rel="icon" href="/fire/favicon.svg" type="image/svg+xml" />

    <script type="module" src="/src/main.ts"></script>
  </body>
