name: Docs
# Builds docs/ with Jekyll into Fire's documentation shell and publishes it to GitHub Pages.
# Fire is copied from apps/server/public/fire at build time, so the repository keeps one copy.
on:
  push:
    branches: [main]
    paths: ['docs/**', 'apps/server/public/fire/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: cp -R apps/server/public/fire docs/assets/fire
      - uses: actions/jekyll-build-pages@v1
        with: { source: ./docs, destination: ./_site }
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
