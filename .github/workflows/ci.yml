name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: ['22.x', '24.x'] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: npm ci
      - run: npm run check
      - run: npm run test:quiet
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24.x' }
      - run: npm ci
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
      - run: ./node_modules/.bin/playwright-core install --with-deps chromium
        working-directory: apps/web
      - run: npm --prefix apps/web run check
