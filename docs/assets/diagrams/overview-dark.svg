<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="overview-title overview-desc">
<title id="overview-title">Imprim in one view</title><desc id="overview-desc">A person gives their agent an app address. The agent asks Imprim for one workspace, the person signs in and approves, and Imprim issues a 60-second token naming the person, the agent and the grant. The agent calls the app, which checks the workspace and the person’s current role. When the person revokes, refresh stops and a signed event tells the app.</desc>
<defs><marker id="overview-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:#8ea2ff"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="719" rx="16" style="fill:#0d1117;stroke:#30363d;stroke-width:1"/>
<rect x="40" y="70" width="250" height="200" rx="10" style="fill:#161b22;stroke:#30363d;stroke-width:1"/>
<text x="62" y="106.0" text-anchor="start" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:21px;font-weight:700;fill:#e6edf3">Person</text>
<text x="62" y="138.0" text-anchor="start" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:15px;font-weight:400;fill:#9aa4b2">Signs in once per brand</text>
<text x="62" y="159.8" text-anchor="start" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:15px;font-weight:400;fill:#9aa4b2">Approves one workspace</text>
<text x="62" y="181.5" text-anchor="start" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:15px;font-weight:400;fill:#9aa4b2">and named scopes</text>
<text x="62" y="203.3" text-anchor="start" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:15px;font-weight:400;fill:#9aa4b2">Sees and revokes each</text>
<text x="62" y="225.0" text-anchor="start" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:15px;font-weight:400;fill:#9aa4b2">agent at any time</text>
<rect x="440" y="40" width="320" height="330" rx="14" style="fill:#1a2040;stroke:#8ea2ff;stroke-width:2"/>
<text x="462" y="80.0" text-anchor="start" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:26px;font-weight:800;fill:#e6edf3">Imprim</text>
<text x="462" y="103.0" text-anchor="start" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:13.5px;font-weight:400;fill:#9aa4b2">OpenID Connect and OAuth 2.1</text>
<text x="462" y="138.0" text-anchor="start" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:700;fill:#8ea2ff;letter-spacing:0.08em">PEOPLE</text>
<text x="462" y="158.0" text-anchor="start" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:14px;font-weight:400;fill:#e6edf3">Email link, password, passkeys,</text>
<text x="462" y="176.2" text-anchor="start" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:14px;font-weight:400;fill:#e6edf3">Google, GitHub, any OIDC; MFA</text>
<text x="462" y="196.0" text-anchor="start" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:700;fill:#8ea2ff;letter-spacing:0.08em">AGENTS</text>
<text x="462" y="216.0" text-anchor="start" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:14px;font-weight:400;fill:#e6edf3">Any agent, 60-second tokens,</text>
<text x="462" y="234.2" text-anchor="start" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:14px;font-weight:400;fill:#e6edf3">rotating refresh, DPoP</text>
<text x="462" y="254.0" text-anchor="start" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:700;fill:#8ea2ff;letter-spacing:0.08em">MACHINES</text>
<text x="462" y="274.0" text-anchor="start" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:14px;font-weight:400;fill:#e6edf3">Signed keys, never shared secrets;</text>
<text x="462" y="292.2" text-anchor="start" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:14px;font-weight:400;fill:#e6edf3">token exchange between apps</text>
<text x="462" y="312.0" text-anchor="start" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:700;fill:#8ea2ff;letter-spacing:0.08em">REALMS</text>
<text x="462" y="332.0" text-anchor="start" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:14px;font-weight:400;fill:#e6edf3">Many brands on one deployment</text>
<rect x="910" y="70" width="250" height="200" rx="10" style="fill:#161b22;stroke:#30363d;stroke-width:1"/>
<text x="932" y="106.0" text-anchor="start" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:21px;font-weight:700;fill:#e6edf3">Your MCP server</text>
<text x="932" y="138.0" text-anchor="start" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:15px;font-weight:400;fill:#9aa4b2">Checks the token is for</text>
<text x="932" y="159.8" text-anchor="start" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:15px;font-weight:400;fill:#9aa4b2">this exact workspace</text>
