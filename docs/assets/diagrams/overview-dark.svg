<text x="452" y="546.0" text-anchor="start" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:21px;font-weight:700;fill:#e6edf3">Agent</text>
<text x="452" y="576.0" text-anchor="start" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:15px;font-weight:400;fill:#9aa4b2">Claude Code, Cursor, Codex, a CLI</text>
<text x="452" y="597.8" text-anchor="start" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:15px;font-weight:400;fill:#9aa4b2">Acts for the person, never as them</text>
<text x="452" y="619.5" text-anchor="start" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:15px;font-weight:400;fill:#9aa4b2">Holds no secret of its own</text>
