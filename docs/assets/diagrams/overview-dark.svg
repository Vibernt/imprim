<text x="932" y="203.3" text-anchor="start" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:15px;font-weight:400;fill:#9aa4b2">person’s current role</text>
<text x="932" y="225.0" text-anchor="start" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:15px;font-weight:400;fill:#9aa4b2">Keeps its own sessions</text>
